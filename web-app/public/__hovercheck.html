<!doctype html>
<html><head><meta charset="utf-8"><title>hovercheck</title></head>
<body><pre id="o">running…</pre>
<script>
const m = (q) => matchMedia(q).matches;
document.getElementById('o').textContent = JSON.stringify({
  "hover: hover": m("(hover: hover)"),
  "hover: none": m("(hover: none)"),
  "pointer: fine": m("(pointer: fine)"),
  "pointer: coarse": m("(pointer: coarse)"),
  "any-hover: hover": m("(any-hover: hover)"),
  "any-pointer: fine": m("(any-pointer: fine)"),
  "maxTouchPoints": navigator.maxTouchPoints,
  "userAgent": navigator.userAgent
}, null, 1);
</script></body></html>
